<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>紅白国旗合戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Color+Emoji&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 対面テーブル型。ゲーム中は画面を上下に割り、上半分を180°回して向かい合う。中央の帯に両者の点数とタイマー。設定と結果は縦1列 */
:root{
  --ai:#131A31;          /* 藍の地 */
  --ai-2:#1C2547;        /* 一段上の面 */
  --key:#28325C;         /* 解答キーの面 */
  --line:#2E3966;
  --ink:#F2F3F7;
  --mute:#98A0C2;
  --aka:#E5383B;         /* 紅組 */
  --aka-deep:#9E2027;
  --shiro:#F2F3F7;       /* 白組 */
  --shiro-deep:#AEB4CC;
  --kin:#F4C24D;         /* 正解・勝者 */
  --kin-deep:#B5841A;
  --kin-ink:#2B2000;
  --veil:rgba(19,26,49,.78);
  --shadow:rgba(4,7,18,.55);
  --display:'Dela Gothic One','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --flag:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ai)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--ai);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--kin);outline-offset:2px}

.screen{height:100%}
#start,#result{overflow-y:auto;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:460px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}

/* 万国旗 */
.bunting{position:relative;margin-inline:-16px;height:92px;overflow:hidden;pointer-events:none}
.bunting svg{position:absolute;left:0;top:0;overflow:visible}
.bunting path{stroke:var(--mute);stroke-width:1.5;fill:none}
.pen{position:absolute;transform-origin:50% 0}
.sway{display:block;font-family:var(--flag);font-size:30px;line-height:1;margin-top:-5px;transform-origin:50% 0;animation:sway 3.4s ease-in-out infinite alternate;filter:drop-shadow(0 3px 4px var(--shadow))}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.hero{display:flex;flex-direction:column;gap:10px;margin-top:-6px}
.hero h1{margin:0;font:400 clamp(46px,15vw,72px)/1.04 var(--display);letter-spacing:.02em;text-wrap:balance}
.t-aka{color:var(--aka)}
.t-shiro{color:var(--shiro)}
.lede{margin:0;color:var(--mute);max-width:34em}

.label{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.players{display:grid;gap:10px}
.player{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--ai-2)}
.seat{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.player input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:0;border-radius:9px;background:var(--key);font-weight:700;font-size:16px}
.disc{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 17px/1 var(--display)}
.aka .disc{background:var(--aka);color:var(--ink)}
.shiro .disc{background:var(--shiro);color:var(--ai)}

.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{position:relative;display:block}
.lv input{position:absolute;opacity:0;width:1px;height:1px}
.lv-face{display:flex;flex-direction:column;gap:2px;height:100%;padding:10px;border-radius:12px;border:2px solid var(--key);background:transparent;cursor:pointer;transition:border-color .15s,background .15s}
.lv-name{font-weight:700;font-size:15px;line-height:1.3}
.lv-note{font-size:12px;line-height:1.35;color:var(--mute)}
.lv input:checked + .lv-face{border-color:var(--ink);background:var(--ai-2)}
.lv input:focus-visible + .lv-face{outline:3px solid var(--kin);outline-offset:2px}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ai-2);cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.knob{flex:none;position:relative;width:46px;height:26px;border-radius:13px;background:var(--key);transition:background .15s}
.knob::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.switch input:checked + .knob{background:var(--aka)}
.switch input:checked + .knob::after{transform:translateX(20px);background:var(--ink)}
.switch input:focus-visible + .knob{outline:3px solid var(--kin);outline-offset:2px}

.cta{width:100%;min-height:60px;border:0;border-radius:14px;background:var(--shiro);color:var(--ai);font:400 22px/1 var(--display);letter-spacing:.06em;box-shadow:0 5px 0 var(--aka-deep);transition:transform .06s,box-shadow .06s;touch-action:manipulation}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--aka-deep)}
.ghost{width:100%;min-height:50px;border:2px solid var(--key);border-radius:14px;background:transparent;font-weight:700}
.rules{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--mute);font-size:13px}
.rules b{color:var(--ink)}

/* ゲーム盤 */
#game{display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);max-width:540px;margin-inline:auto;padding-inline:16px;user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation}
.half{display:flex;flex-direction:column;gap:8px;min-height:0;padding-block:10px 12px}
.half.top{transform:rotate(180deg)}
.half.bottom{--lip:var(--aka-deep)}
.half.top{--lip:var(--shiro-deep)}
.flagbox{position:relative;flex:1 1 auto;min-height:64px;container-type:size;display:grid;place-items:center}
.flag{font-family:var(--flag);font-size:min(80cqh,60cqw,230px);line-height:1;filter:drop-shadow(0 0 .5px rgba(242,243,247,.6)) drop-shadow(0 8px 14px var(--shadow))}
.flag.in{animation:flagin .22s ease-out}
@keyframes flagin{from{transform:scale(.86);opacity:.2}to{transform:none;opacity:1}}
.count{position:absolute;inset:0;display:grid;place-items:center;font:400 min(70cqh,40cqw)/1 var(--display)}
.count:empty,.stamp:empty{display:none}
.count.beat{animation:beat .5s ease-out}
@keyframes beat{from{transform:scale(1.35);opacity:.3}to{transform:none;opacity:1}}
.stamp{position:absolute;left:50%;top:50%;padding:4px 14px;border:3px solid currentColor;border-radius:10px;background:var(--veil);font:400 clamp(18px,10cqh,30px)/1.2 var(--display);letter-spacing:.08em;white-space:nowrap;transform:translate(-50%,-50%) rotate(-10deg);animation:stamp .22s cubic-bezier(.2,1.6,.4,1)}
.stamp.ok{color:var(--kin)}
.stamp.ng{color:var(--mute)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-10deg) scale(1.9);opacity:0}to{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}
.cap{margin:0;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.cap-main{font:400 18px/1.2 var(--display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cap-sub{font-size:12px;color:var(--mute);white-space:nowrap}
.cap-sub .code{font-family:var(--mono);color:var(--ink);letter-spacing:.06em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:4px}
.opt{min-height:52px;padding:6px 8px;border:0;border-radius:12px;background:var(--key);font-weight:700;font-size:15px;line-height:1.22;box-shadow:0 4px 0 var(--lip);touch-action:manipulation;transition:transform .06s,box-shadow .06s,background .15s,opacity .2s;overflow-wrap:anywhere}
.opt.long{font-size:13px}
.opt.xlong{font-size:12px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
.opts.off .opt{pointer-events:none}
.opt.right{background:var(--kin);color:var(--kin-ink);box-shadow:0 4px 0 var(--kin-deep)}
.opt.wrong{background:transparent;color:var(--mute);text-decoration:line-through;box-shadow:inset 0 0 0 2px var(--key)}
.half.locked .opt:not(.wrong):not(.right){opacity:.32}

.mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(104px,1.1fr) minmax(0,1fr);align-items:center;gap:10px;padding-block:6px;border-block:1px solid var(--line)}
.side{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.side.p1{transform:rotate(180deg)}
.side .disc{width:28px;height:28px;font-size:14px}
.side-txt{display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.side .nm{font-size:11px;font-weight:700;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.side .sc{font:400 24px/1 var(--display);font-variant-numeric:tabular-nums}
.sc.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1.8);color:var(--kin)}100%{transform:none}}
.clock{display:flex;flex-direction:column;align-items:center;gap:4px}
.qn{font:400 12px/1 var(--display);color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.qn.flip{transform:rotate(180deg)}
.timer{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;border-radius:3px;background:var(--ink);transform-origin:50% 50%}
.timer i.hurry{background:var(--kin)}
.below{display:flex;align-items:center;gap:8px}
.quit{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mute);font-size:11px;font-weight:700;line-height:1.5}
.quit.arm{border-color:var(--aka);color:var(--ink);background:var(--aka-deep)}

/* 結果 */
.flipnote{margin:14px 0 0;align-self:center;padding:6px 14px;border-radius:999px;background:var(--ai-2);font-size:13px;font-weight:700;transform:rotate(180deg);text-align:center}
.res-head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.res-head h1{margin:0;font:400 clamp(30px,9vw,44px)/1.15 var(--display);text-wrap:balance}
.res-head h1 .who{color:var(--kin)}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;width:100%;padding:16px;border-radius:18px;background:var(--ai-2)}
.board .team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.board .nm{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .big{font:400 56px/1 var(--display);font-variant-numeric:tabular-nums}
.board .team.win .big{color:var(--kin)}
.board .dash{font:400 28px/1 var(--display);color:var(--mute)}
.actions{display:grid;gap:12px}
.review{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.review li{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--ai-2)}
.review .no{font:400 12px/1 var(--display);color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.review .fl{font-family:var(--flag);font-size:30px;line-height:1;text-align:center}
.review .cn{min-width:0;line-height:1.3}
.review .cn b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review .cn span{font-size:11px;color:var(--mute)}
.review .cn .code{font-family:var(--mono);color:var(--ink)}
.chip{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.c0{background:var(--aka);color:var(--ink)}
.chip.c1{background:var(--shiro);color:var(--ai)}
.chip.cn{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}

@media (prefers-reduced-motion: reduce){
  .sway,.flag.in,.count.beat,.stamp,.sc.pop{animation:none}
  .opt,.cta,.knob,.knob::after,.lv-face{transition:none}
}
</style>
</head>
<body>

<div id="app" style="height:100%">

<section id="start" class="screen">
  <div class="wrap">
    <div class="bunting" id="bunting1" aria-hidden="true"></div>
    <header class="hero">
      <p class="eyebrow">2人で早押し・全10問・1問10秒</p>
      <h1><span class="t-aka">紅</span><span class="t-shiro">白</span><br>国旗合戦</h1>
      <p class="lede">スマホを2人のあいだに置いて、向かい合って遊びます。国旗を見て、正しい国名を先にタップしたほうに1点。</p>
    </header>

    <section>
      <h2 class="label">対戦する2人</h2>
      <div class="players">
        <label class="player aka" for="name0">
          <span class="disc" aria-hidden="true">紅</span>
          <span><span class="seat">紅組・画面の手前側に座る人</span><input id="name0" maxlength="8" autocomplete="off" value="あか"></span>
        </label>
        <label class="player shiro" for="name1">
          <span class="disc" aria-hidden="true">白</span>
          <span><span class="seat">白組・向こう側に座る人(画面の上半分を使う)</span><input id="name1" maxlength="8" autocomplete="off" value="しろ"></span>
        </label>
      </div>
    </section>

    <section>
      <h2 class="label">むずかしさ</h2>
      <div class="levels" role="radiogroup" aria-label="むずかしさ">
        <label class="lv"><input type="radio" name="level" id="lv-easy" value="easy" checked><span class="lv-face"><span class="lv-name">かんたん</span><span class="lv-note" id="note-easy">有名な国だけ</span></span></label>
        <label class="lv"><input type="radio" name="level" id="lv-normal" value="normal"><span class="lv-face"><span class="lv-name">ふつう</span><span class="lv-note" id="note-normal">世界の全部の国</span></span></label>
        <label class="lv"><input type="radio" name="level" id="lv-hard" value="hard"><span class="lv-face"><span class="lv-name">むずかしい</span><span class="lv-note">全部の国・選択肢が同じ地域</span></span></label>
      </div>
    </section>

    <label class="switch" for="sound">
      <span><b>効果音</b><span class="seat">正解・おてつきの音を鳴らす</span></span>
      <input type="checkbox" id="sound" checked><span class="knob" aria-hidden="true"></span>
    </label>

    <button class="cta" id="go" type="button">はじめる</button>

    <ul class="rules">
      <li><b>先に</b>正しい国名をタップした人に1点</li>
      <li>まちがえると<b>おてつき</b>。その問題はもう押せません</li>
      <li>2人ともおてつき、または10秒たつと0点で次へ</li>
    </ul>
  </div>
</section>

<section id="game" class="screen" hidden aria-label="対戦中">
  <div class="half top shiro" id="h1">
    <div class="flagbox"><span class="flag" role="img" aria-label="国旗"></span><span class="count"></span><span class="stamp"></span></div>
    <p class="cap"><span class="cap-main"></span><span class="cap-sub"></span></p>
    <div class="opts off">
      <button class="opt" type="button" id="o1-0"></button><button class="opt" type="button" id="o1-1"></button>
      <button class="opt" type="button" id="o1-2"></button><button class="opt" type="button" id="o1-3"></button>
    </div>
  </div>

  <div class="mid">
    <div class="side p1 shiro"><span class="side-txt"><span class="nm" id="nm1"></span><span class="sc" id="sc1">0</span></span><span class="disc" aria-hidden="true">白</span></div>
    <div class="clock">
      <span class="qn flip" id="qn1">1/10</span>
      <div class="timer" role="presentation"><i id="bar"></i></div>
      <span class="below"><span class="qn" id="qn0">1/10</span><button class="quit" id="quit" type="button">中断</button></span>
    </div>
    <div class="side p0 aka"><span class="side-txt"><span class="nm" id="nm0"></span><span class="sc" id="sc0">0</span></span><span class="disc" aria-hidden="true">紅</span></div>
  </div>

  <div class="half bottom aka" id="h0">
    <div class="flagbox"><span class="flag" role="img" aria-label="国旗"></span><span class="count"></span><span class="stamp"></span></div>
    <p class="cap"><span class="cap-main"></span><span class="cap-sub"></span></p>
    <div class="opts off">
      <button class="opt" type="button" id="o0-0"></button><button class="opt" type="button" id="o0-1"></button>
      <button class="opt" type="button" id="o0-2"></button><button class="opt" type="button" id="o0-3"></button>
    </div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <div class="wrap">
    <p class="flipnote" id="flipnote"></p>
    <div class="bunting" id="bunting2" aria-hidden="true"></div>
    <header class="res-head">
      <p class="eyebrow">全10問 終了</p>
      <h1 id="res-title"></h1>
      <div class="board">
        <div class="team aka" id="t0"><span class="disc" aria-hidden="true">紅</span><span class="nm" id="rn0"></span><span class="big" id="rs0">0</span></div>
        <span class="dash">–</span>
        <div class="team shiro" id="t1"><span class="disc" aria-hidden="true">白</span><span class="nm" id="rn1"></span><span class="big" id="rs1">0</span></div>
      </div>
    </header>
    <div class="actions">
      <button class="cta" id="again" type="button">もう一回</button>
      <button class="ghost" id="back" type="button">設定にもどる</button>
    </div>
    <section>
      <h2 class="label">10問のふりかえり</h2>
      <ol class="review" id="review"></ol>
    </section>
  </div>
</section>

</div>

<script>
(() => {
'use strict';
const REG = {a:'アジア', w:'西アジア', e:'ヨーロッパ', f:'アフリカ', n:'北・中央アメリカ', s:'南アメリカ', o:'オセアニア'};
const DATA = {
  a:'jp日本*,cn中国*,kr韓国*,kp北朝鮮,mnモンゴル*,inインド*,pkパキスタン,bdバングラデシュ,lkスリランカ,npネパール*,btブータン,mvモルディブ,afアフガニスタン,thタイ*,vnベトナム*,laラオス,khカンボジア,mmミャンマー,myマレーシア*,sgシンガポール*,idインドネシア*,phフィリピン*,bnブルネイ,tl東ティモール,kzカザフスタン,uzウズベキスタン,tmトルクメニスタン,kgキルギス,tjタジキスタン',
  w:'trトルコ*,saサウジアラビア*,aeアラブ首長国連邦*,qaカタール,kwクウェート,bhバーレーン,omオマーン,yeイエメン,iqイラク,irイラン,syシリア,joヨルダン,lbレバノン,ilイスラエル*,geジョージア,amアルメニア,azアゼルバイジャン',
  e:'gbイギリス*,frフランス*,deドイツ*,itイタリア*,esスペイン*,ptポルトガル*,nlオランダ*,beベルギー*,luルクセンブルク,ieアイルランド*,chスイス*,atオーストリア*,liリヒテンシュタイン,mcモナコ,adアンドラ,smサンマリノ,vaバチカン,mtマルタ,dkデンマーク*,noノルウェー*,seスウェーデン*,fiフィンランド*,isアイスランド,eeエストニア,lvラトビア,ltリトアニア,plポーランド*,czチェコ,skスロバキア,huハンガリー,siスロベニア,hrクロアチア,baボスニア・ヘルツェゴビナ,rsセルビア,meモンテネグロ,mk北マケドニア,alアルバニア,grギリシャ*,bgブルガリア,roルーマニア,mdモルドバ,uaウクライナ*,byベラルーシ,ruロシア*,cyキプロス',
  f:'egエジプト*,lyリビア,tnチュニジア,dzアルジェリア,maモロッコ*,sdスーダン,ss南スーダン,etエチオピア,erエリトリア,djジブチ,soソマリア,keケニア*,ugウガンダ,rwルワンダ,biブルンジ,tzタンザニア,cdコンゴ民主共和国,cgコンゴ共和国,gaガボン,gq赤道ギニア,cmカメルーン,cf中央アフリカ,tdチャド,neニジェール,ngナイジェリア*,bjベナン,tgトーゴ,ghガーナ,ciコートジボワール,lrリベリア,slシエラレオネ,gnギニア,gwギニアビサウ,snセネガル,gmガンビア,mlマリ,bfブルキナファソ,mrモーリタニア,cvカーボベルデ,stサントメ・プリンシペ,aoアンゴラ,zmザンビア,zwジンバブエ,mwマラウイ,mzモザンビーク,bwボツワナ,naナミビア,za南アフリカ*,lsレソト,szエスワティニ,mgマダガスカル,muモーリシャス,scセーシェル,kmコモロ',
  n:'usアメリカ*,caカナダ*,mxメキシコ*,gtグアテマラ,bzベリーズ,svエルサルバドル,hnホンジュラス,niニカラグア,crコスタリカ,paパナマ,cuキューバ*,jmジャマイカ*,htハイチ,doドミニカ共和国,bsバハマ,bbバルバドス,ttトリニダード・トバゴ,gdグレナダ,lcセントルシア,vcセントビンセント・グレナディーン,agアンティグア・バーブーダ,knセントクリストファー・ネイビス,dmドミニカ国',
  s:'brブラジル*,arアルゼンチン*,clチリ*,uyウルグアイ,pyパラグアイ,boボリビア,peペルー*,ecエクアドル,coコロンビア*,veベネズエラ,gyガイアナ,srスリナム',
  o:'auオーストラリア*,nzニュージーランド*,pgパプアニューギニア,fjフィジー,sbソロモン諸島,vuバヌアツ,wsサモア,toトンガ,kiキリバス,tvツバル,nrナウル,pwパラオ,fmミクロネシア,mhマーシャル諸島'
};
const ALL = [];
for (const r in DATA) for (const s of DATA[r].split(',')) {
  const f = s.endsWith('*');
  ALL.push({k: s.slice(0, 2), n: (f ? s.slice(2, -1) : s.slice(2)), r, f});
}
const BY = Object.fromEntries(ALL.map(c => [c.k, c]));
const FAMOUS = ALL.filter(c => c.f);
// ほぼ同じ見た目の旗は同じ問題の選択肢に並べない
const TWINS = [['id','mc'], ['td','ro']];
const twin = (a, b) => TWINS.some(([x, y]) => (a === x && b === y) || (a === y && b === x));
const flagOf = k => String.fromCodePoint(...[...k.toUpperCase()].map(ch => 0x1F1A5 + ch.charCodeAt(0)));
const $ = id => document.getElementById(id);
const TOTAL = 10, TIME = 10000;

$('note-easy').textContent = `有名な${FAMOUS.length}か国`;
$('note-normal').textContent = `全${ALL.length}か国`;

/* ---------- 設定 ---------- */
let cfg = {names: ['あか', 'しろ'], level: 'easy', sound: true};
try { const s = JSON.parse(localStorage.getItem('kokki-gassen') || 'null'); if (s) cfg = {...cfg, ...s}; } catch (e) {}
function saveCfg() { try { localStorage.setItem('kokki-gassen', JSON.stringify(cfg)); } catch (e) {} }
function cfgToForm() {
  $('name0').value = cfg.names[0]; $('name1').value = cfg.names[1];
  const r = document.querySelector(`input[name=level][value=${cfg.level}]`); if (r) r.checked = true;
  $('sound').checked = !!cfg.sound;
}
function formToCfg() {
  cfg.names = [$('name0').value.trim() || 'あか', $('name1').value.trim() || 'しろ'];
  cfg.level = (document.querySelector('input[name=level]:checked') || {}).value || 'easy';
  cfg.sound = $('sound').checked;
  saveCfg();
}

/* ---------- 音・振動・画面スリープ防止 ---------- */
let ac = null;
function tone(f, d, type = 'triangle', at = 0, v = .12) {
  if (!cfg.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sfx = {
  tick: () => tone(660, .09, 'square', 0, .05),
  go: () => tone(990, .2, 'square', 0, .06),
  right: () => { tone(784, .12); tone(1175, .2, 'triangle', .1); },
  wrong: () => tone(170, .25, 'sawtooth', 0, .07),
  none: () => tone(330, .3, 'sine', 0, .1),
  end: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', i * .13))
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
let lock = null;
async function wake(on) {
  try {
    if (on && navigator.wakeLock && !lock) lock = await navigator.wakeLock.request('screen');
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) { lock = null; }
}

/* ---------- 万国旗 ---------- */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const banners = {bunting1: shuffle(FAMOUS.map(c => c.k)), bunting2: []};
function bunting(id) {
  const el = $(id); if (!el) return;
  const W = el.clientWidth; if (!W) return;
  const codes = banners[id].length ? banners[id] : (banners[id] = shuffle(ALL.map(c => c.k)));
  const n = Math.max(6, Math.min(14, Math.round(W / 44)));
  const top = 4, sag = Math.min(34, W * .07);
  el.innerHTML = `<svg width="${W}" height="${top + sag + 4}" viewBox="0 0 ${W} ${top + sag + 4}"><path d="M0 ${top} Q ${W / 2} ${top + 2 * sag} ${W} ${top}"/></svg>`;
  for (let k = 0; k < n; k++) {
    const t = (k + .5) / n, x = W * t, y = top + 4 * sag * t * (1 - t);
    const a = Math.atan(4 * sag * (1 - 2 * t) / W) * 180 / Math.PI;
    const p = document.createElement('span');
    p.className = 'pen'; p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.transform = `translateX(-50%) rotate(${a.toFixed(2)}deg)`;
    const s = document.createElement('span');
    s.className = 'sway'; s.textContent = flagOf(codes[k % codes.length]);
    s.style.animationDelay = (-k * .41).toFixed(2) + 's';
    p.append(s); el.append(p);
  }
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { bunting('bunting1'); bunting('bunting2'); }, 150); });

/* ---------- 画面 ---------- */
let screen = 'start';
function show(id) {
  screen = id;
  for (const s of ['start', 'game', 'result']) $(s).hidden = s !== id;
  if (id === 'start') bunting('bunting1');
  if (id === 'result') bunting('bunting2');
  wake(id === 'game');
}

/* ---------- 問題づくり ---------- */
function makeQuestions(level) {
  const pool = level === 'easy' ? FAMOUS : ALL;
  return shuffle(pool.slice()).slice(0, TOTAL).map(ans => {
    let cand = level === 'hard' ? ALL.filter(c => c.r === ans.r) : pool.slice();
    cand = shuffle(cand.filter(c => c.k !== ans.k && !twin(c.k, ans.k)));
    const ds = [];
    const take = list => { for (const c of list) { if (ds.length === 3) break; if (ds.includes(c) || twin(c.k, ans.k) || ds.some(d => twin(d.k, c.k))) continue; ds.push(c); } };
    take(cand);
    if (ds.length < 3) take(shuffle(ALL.filter(c => c.k !== ans.k)));
    return {k: ans.k, opts: shuffle([ans, ...ds]).map(c => c.k), w: null};
  });
}

/* ---------- 対戦 ---------- */
const H = [0, 1].map(p => {
  const root = $('h' + p);
  return {
    root,
    flag: root.querySelector('.flag'), count: root.querySelector('.count'), stamp: root.querySelector('.stamp'),
    main: root.querySelector('.cap-main'), sub: root.querySelector('.cap-sub'),
    wrap: root.querySelector('.opts'), opts: [0, 1, 2, 3].map(i => $(`o${p}-${i}`))
  };
});
const bar = $('bar');
let G = null;   // {qs, i, score, names, level}
let R = null;   // その問題の状態
let gen = 0;    // 古いタイマーを無効にするための世代番号

function setCap(p, main, subHTML) { H[p].main.textContent = main; H[p].sub.innerHTML = subHTML; }
function setStamp(p, text, kind) {
  const s = H[p].stamp; s.textContent = ''; s.className = 'stamp ' + (kind || '');
  void s.offsetWidth; s.textContent = text;
}
function scores() {
  for (const p of [0, 1]) { $('sc' + p).textContent = G.score[p]; $('nm' + p).textContent = G.names[p]; }
}
function qn() { const t = `${Math.min(G.i + 1, TOTAL)}/${TOTAL}`; $('qn0').textContent = t; $('qn1').textContent = t; }
function timerReset() { bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; bar.classList.remove('hurry'); }
function timerRun() {
  timerReset(); void bar.offsetWidth;
  bar.style.transition = `transform ${TIME}ms linear`; bar.style.transform = 'scaleX(0)';
}
function timerFreeze() {
  const m = getComputedStyle(bar).transform;
  bar.style.transition = 'none'; bar.style.transform = (m && m !== 'none') ? m : 'scaleX(1)';
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function startGame() {
  formToCfg();
  G = {qs: makeQuestions(cfg.level), i: 0, score: [0, 0], names: cfg.names.slice(), level: cfg.level};
  enterGame();
}
function enterGame() {
  show('game'); scores(); qn(); timerReset(); disarmQuit();
  const g = ++gen;
  for (const p of [0, 1]) {
    const h = H[p];
    h.root.classList.remove('locked');
    h.flag.textContent = ''; h.stamp.textContent = '';
    h.wrap.classList.add('off');
    h.opts.forEach(b => { b.textContent = ''; b.className = 'opt'; });
    setCap(p, 'じゅんび', p === 0 ? `あいては <b>${esc(G.names[1])}</b>` : `あいては <b>${esc(G.names[0])}</b>`);
  }
  let n = 3;
  const step = () => {
    if (g !== gen) return;
    if (n === 0) { H.forEach(h => h.count.textContent = ''); sfx.go(); showQ(); return; }
    H.forEach(h => { h.count.textContent = n; h.count.classList.remove('beat'); void h.count.offsetWidth; h.count.classList.add('beat'); });
    sfx.tick(); n--; setTimeout(step, 750);
  };
  step();
}
function showQ() {
  const g = ++gen, q = G.qs[G.i];
  R = {locked: [false, false], done: false, open: false, to: 0, hurry: 0};
  qn(); timerReset();
  for (const p of [0, 1]) {
    const h = H[p];
    h.root.classList.remove('locked');
    h.stamp.textContent = '';
    h.flag.textContent = flagOf(q.k);
    h.flag.classList.remove('in'); void h.flag.offsetWidth; h.flag.classList.add('in');
    setCap(p, 'どこの国？', '先に正しい国をタップ');
    h.wrap.classList.add('off');
    h.opts.forEach((b, i) => {
      const name = BY[q.opts[i]].n;
      b.textContent = name;
      b.className = 'opt' + (name.length > 13 ? ' xlong' : name.length > 9 ? ' long' : '');
    });
  }
  setTimeout(() => {
    if (g !== gen || R.done) return;
    R.open = true;
    H.forEach(h => h.wrap.classList.remove('off'));
    timerRun();
    R.hurry = setTimeout(() => { if (g === gen) bar.classList.add('hurry'); }, TIME - 3000);
    R.to = setTimeout(() => { if (g === gen && !R.done) { R.done = true; G.qs[G.i].w = -1; reveal(-1, 'time'); } }, TIME);
  }, 380);
}
function answer(p, i) {
  if (!R || !R.open || R.done || R.locked[p]) return;
  const q = G.qs[G.i];
  if (q.opts[i] === q.k) {
    R.done = true; q.w = p; G.score[p]++;
    reveal(p);
  } else {
    R.locked[p] = true;
    H[p].opts[i].classList.add('wrong');
    H[p].root.classList.add('locked');
    setStamp(p, 'おてつき', 'ng');
    setCap(p, 'おてつき！', 'あいてが答えるのを待とう');
    sfx.wrong(); buzz(120);
    if (R.locked[0] && R.locked[1]) { R.done = true; q.w = -1; reveal(-1, 'both'); }
  }
}
function reveal(w, why) {
  clearTimeout(R.to); clearTimeout(R.hurry); timerFreeze();
  const g = gen, q = G.qs[G.i], c = BY[q.k], ri = q.opts.indexOf(q.k);
  const meta = `<span class="code">${c.k.toUpperCase()}</span> · ${REG[c.r]}`;
  for (const p of [0, 1]) {
    const h = H[p];
    h.wrap.classList.add('off');
    h.opts[ri].classList.add('right');
    if (w === p) setStamp(p, '正解 +1', 'ok');
    else if (w === -1 && why === 'time') setStamp(p, '時間切れ', 'ng');
    else if (w !== -1 && !R.locked[p]) setStamp(p, `${G.names[w]}が正解`, 'ng');
    setCap(p, c.n, meta);
  }
  if (w >= 0) {
    const sc = $('sc' + w); sc.textContent = G.score[w];
    sc.classList.remove('pop'); void sc.offsetWidth; sc.classList.add('pop');
    sfx.right(); buzz(40);
  } else if (why === 'time') sfx.none();
  setTimeout(() => {
    if (g !== gen) return;
    G.i++;
    if (G.i < TOTAL) showQ(); else finish();
  }, 2300);
}
function finish() {
  ++gen; R = null;
  const [a, b] = G.score, [n0, n1] = G.names.map(esc);
  const win = a === b ? -1 : (a > b ? 0 : 1);
  $('res-title').innerHTML = win < 0 ? '引き分け！' : `<span class="who">${win === 0 ? n0 : n1}</span>の勝ち！`;
  $('rn0').textContent = G.names[0]; $('rn1').textContent = G.names[1];
  $('rs0').textContent = a; $('rs1').textContent = b;
  $('t0').classList.toggle('win', win === 0); $('t1').classList.toggle('win', win === 1);
  $('flipnote').textContent = `${G.names[1]} ${b}点 ・ ${win < 0 ? '引き分け' : (win === 1 ? 'あなたの勝ち！' : `${G.names[0]}の勝ち`)}`;
  $('review').innerHTML = G.qs.map((q, i) => {
    const c = BY[q.k];
    const chip = q.w === 0 ? `<span class="chip c0">${n0}</span>` : q.w === 1 ? `<span class="chip c1">${n1}</span>` : '<span class="chip cn">なし</span>';
    return `<li><span class="no">${i + 1}</span><span class="fl" role="img" aria-label="${esc(c.n)}の国旗">${flagOf(c.k)}</span><span class="cn"><b>${esc(c.n)}</b><span><span class="code">${c.k.toUpperCase()}</span> · ${REG[c.r]}</span></span>${chip}</li>`;
  }).join('');
  banners.bunting2 = G.qs.map(q => q.k);
  show('result');
  $('result').scrollTop = 0;
  sfx.end();
}

/* 中断は2回タップで確定 */
let quitArm = 0;
function disarmQuit() { clearTimeout(quitArm); quitArm = 0; $('quit').classList.remove('arm'); $('quit').textContent = '中断'; }
$('quit').addEventListener('click', () => {
  if (!quitArm) {
    $('quit').classList.add('arm'); $('quit').textContent = 'もう一度で中断';
    quitArm = setTimeout(disarmQuit, 2500);
    return;
  }
  disarmQuit(); ++gen; R = null; G = null; timerReset(); show('start');
});

/* 2人同時に押せるよう pointerdown で受ける。キーボード操作は click で */
H.forEach((h, p) => h.opts.forEach((b, i) => {
  b.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); answer(p, i); });
  b.addEventListener('click', e => { if (e.detail === 0) answer(p, i); });
}));

$('go').addEventListener('click', startGame);
$('again').addEventListener('click', () => { G = {qs: makeQuestions(G.level), i: 0, score: [0, 0], names: G.names, level: G.level}; enterGame(); });
$('back').addEventListener('click', () => show('start'));
['name0', 'name1', 'sound'].forEach(id => $(id).addEventListener('change', formToCfg));
document.querySelectorAll('input[name=level]').forEach(r => r.addEventListener('change', formToCfg));
document.addEventListener('visibilitychange', () => { if (!document.hidden && screen === 'game') wake(true); });

/* 開いたまま更新されても途中から続けられるように */
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({cfg, G, screen}));
function boot(data) {
  data = data || {};
  if (data.cfg) cfg = {...cfg, ...data.cfg};
  cfgToForm();
  if (data.G && data.screen === 'game') {
    G = data.G;
    if (G.qs[G.i] && G.qs[G.i].w !== null) G.i++;
    if (G.i >= TOTAL) finish(); else enterGame();
  } else if (data.G && data.screen === 'result') { G = data.G; finish(); }
  else show('start');
}
hot && hot.ready ? hot.ready(boot) : boot(hot && hot.data ? hot.data : {});
})();
</script>
